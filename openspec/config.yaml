schema: unbound-force

context: |
  This project follows its containerfile constitution,
  extending the Unbound Force org constitution.
  Four core principles govern all work:

  I. Composability First: The container is independently
     usable with Podman and a mounted project.
  II. Security Through Isolation: Rootless, non-root
      containers contain agent activity.
  III. Reproducible Builds: Multi-architecture images
       and tool installations are verifiable.
  IV. Executable Truth: Container definitions are the
      source of truth for image contents.

  All changes MUST align with these principles.
  Constitution violations are CRITICAL severity.

  Full constitution: openspec/constitution.md

rules:
  proposal:
    - MUST include Constitution Alignment section
    - Each principle needs PASS or N/A with justification
  specs:
    - Use RFC 2119 language (MUST/SHALL/SHOULD/MAY)
    - Use Given/When/Then for all scenarios
  design:
    - Reference constitution alignment from proposal
  tasks:
    - Include verification task for constitution alignment
